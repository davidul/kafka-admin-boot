logging.level.root=DEBUG
logging.level.davidul.online=DEBUG

admin.timeout=1000

# --- KafkaResultQueue eviction ------------------------------------------------
# How long a queued future is kept before it is silently discarded (minutes).
queue.eviction.ttl-minutes=30
# How often the eviction sweep runs (milliseconds, fixed delay after last run).
queue.eviction.interval-ms=60000

# --- Kafka connection -----------------------------------------------------------
# Bootstrap servers. Override via KAFKA_BOOTSTRAP env var.
KAFKA_BOOTSTRAP=localhost:9092

# Security protocol: PLAINTEXT | SSL | SASL_PLAINTEXT | SASL_SSL
KAFKA_SECURITY_PROTOCOL=PLAINTEXT

# --- SASL (required when KAFKA_SECURITY_PROTOCOL=SASL_PLAINTEXT or SASL_SSL) ----
# Mechanism: PLAIN | SCRAM-SHA-256 | SCRAM-SHA-512
#KAFKA_SASL_MECHANISM=SCRAM-SHA-512
#KAFKA_SASL_USERNAME=
#KAFKA_SASL_PASSWORD=

# --- SSL (applied when KAFKA_SECURITY_PROTOCOL=SSL or SASL_SSL) -----------------
# Set to empty string to disable hostname verification (not recommended for prod)
#KAFKA_SSL_ENDPOINT_IDENTIFICATION_ALGORITHM=https


